<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div class="page-container">
    <header class="top-header">
        <div class="mini-searchbar">
            <div class="search-area">
                <span class="search-icon"></span><input type="text" id="search-bar">
            </div>
            <div class="notification-area">
                <div class="notif-icon"></div>
                <div class="profile-picture"></div>
                <div class="username">User Name</div>
            </div>
        </div>
        <div class="lower-toolbar">
            <div class="profile-area">
                <div class="profile-picture"></div>
                <div class="greeting">
                    <p>Hi there,
                    <h4>User Name</h4></p>
                </div>
            </div>
            <div class="button-area">
                <button>New</button>
                <button>Upload</button>
                <button>Share</button>
            </div>
        </div>
    </header>

    <nav class="side-nav">
        <div class="logo-area"></div>
        <div class="nav-area"></div>
        <div class="settings-area"></div>
    </nav>

    <main class="content-area">
        <div class="projects-area">
            <article class="card"></article>
            <article class="card"></article>
            <article class="card"></article>
            <article class="card"></article>
            <article class="card"></article>
            <article class="card"></article>
        </div>

        <div class="announcments">
            <div class="announcments-card"></div>
            <div class="announcments-card"></div>
            <div class="announcments-card"></div>
        </div>

        <div class="trending">
            <div class="trending-card"></div>
            <div class="trending-card"></div>
            <div class="trending-card"></div>
            <div class="trending-card"></div>
        </div>

    </main>
    </div>
</body>
</html>
